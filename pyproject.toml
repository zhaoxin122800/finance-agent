[project]
name = "finance-agent"
version = "0.1.0"
description = "自用本地 Web 金融助手 — 整合 A 股数据/分析/模拟交易/AI 解读"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=1.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
data-premium = [
    "mootdx>=0.11",
    "requests>=2.31",
    "pandas>=2.0",
]
pdf = [
    "pdfplumber>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
