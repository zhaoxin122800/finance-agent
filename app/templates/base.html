<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Agent{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="topnav">
        <a href="/" class="brand">
            <span class="brand-dot"></span>
            Finance Agent
        </a>
        <div class="clock" id="clock">--:--:--</div>
        <div class="nav-links">
            <a href="/watchlist" data-tab="watchlist">自选股</a>
            <a href="/analyst" data-tab="analyst">个股分析</a>
            <a href="/account" data-tab="account">虚拟账户</a>
            <a href="/review" data-tab="review">每日复盘</a>
            <a href="/policy" data-tab="policy">政策监控</a>
            <a href="/report" data-tab="report">研报提炼</a>
            <a href="/backtest" data-tab="backtest">策略回测</a>
            <a href="/risk" data-tab="risk">风险预警</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script>
    // AI markdown 渲染:把 .ai-result 里的原始 markdown 转成安全 HTML
    (function() {
        document.querySelectorAll('.ai-result').forEach(function(el) {
            var raw = el.textContent.trim();
            if (raw && typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                var html = DOMPurify.sanitize(marked.parse(raw));
                el.innerHTML = html;
            }
        });
    })();
    </script>
    <script>
        // 顶部实时时钟(终端感)
        (function() {
            const el = document.getElementById('clock');
            function tick() {
                const d = new Date();
                const pad = n => String(n).padStart(2, '0');
                el.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            }
            tick();
            setInterval(tick, 1000);
        })();
        // 当前 tab 高亮
        (function() {
            const path = location.pathname.split('/')[1] || '';
            document.querySelectorAll('.nav-links a').forEach(a => {
                if (a.dataset.tab === path) a.classList.add('active');
            });
        })();
    </script>
</body>
</html>
